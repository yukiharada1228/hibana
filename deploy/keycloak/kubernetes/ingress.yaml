# Label only the trusted controller namespace hibana.io/identity-ingress=true.
# The controller must overwrite X-Forwarded-* from untrusted clients.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
spec:
  ingressClassName: hibana
  tls:
    - hosts: [auth.example.internal]
      secretName: keycloak-tls
  rules:
    - host: auth.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
