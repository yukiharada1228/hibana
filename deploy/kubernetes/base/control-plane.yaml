apiVersion: v1
kind: ServiceAccount
metadata:
  name: hibana-control-plane
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hibana-control-plane
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hibana-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hibana-control-plane
        app.kubernetes.io/part-of: hibana
    spec:
      serviceAccountName: hibana-control-plane
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          nodeTaintsPolicy: Honor
          # Count only the incoming revision so old Pods cannot skew rollout placement.
          matchLabelKeys: [pod-template-hash]
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hibana-control-plane
      containers:
        - name: control-plane
          image: hibana-platform
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/hibana-control-plane"]
          envFrom:
            - configMapRef:
                name: hibana-config
            - secretRef:
                name: hibana-runtime
            - secretRef:
                name: hibana-control-plane
          ports:
            - name: http
              containerPort: 8080
            - name: internal
              containerPort: 8081
            - name: apps
              containerPort: 8083
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
              ephemeral-storage: "1Gi"
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: hibana-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hibana-control-plane
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: hibana-internal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hibana-control-plane
  ports:
    - name: internal
      port: 8081
      targetPort: internal
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hibana-control-plane
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hibana-control-plane

---
apiVersion: v1
kind: Service
metadata:
  name: hibana-apps
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hibana-control-plane
  ports:
    - name: apps
      port: 8083
      targetPort: apps
