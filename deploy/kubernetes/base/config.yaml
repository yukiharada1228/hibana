apiVersion: v1
kind: ConfigMap
metadata:
  name: hibana-config
data:
  RUN_MIGRATIONS: "false"
  BIND_ADDR: "0.0.0.0:8080"
  APP_BIND_ADDR: "0.0.0.0:8083"
  WORKER_HTTP_URL: "http://hibana-worker-discovery:8084"
  WORKER_HTTP_BIND_ADDR: "0.0.0.0:8084"
  INTERNAL_BIND_ADDR: "0.0.0.0:8081"
  METRICS_BIND_ADDR: "0.0.0.0:9090"
  CONTROL_PLANE_INTERNAL_URL: "http://hibana-internal:8081"
  S3_ENDPOINT: "https://objects.example.internal"
  S3_REGION: "us-east-1"
  S3_BUCKET: "hibana-components"
  INGRESS_BASE_DOMAIN: "apps.example.internal"
  JOB_SIGNING_KID: "k1"
  SECRETS_MASTER_KID: "k1"
  WORKER_MAX_CONCURRENCY: "8"
  WORKER_GUEST_MEMORY_BUDGET_MIB: "2048"
  WORKER_MAX_COMPILATIONS: "1"
  WORKER_COMPILER_MEMORY_MIB: "1024"
  WORKER_COMPILER_TIMEOUT_SECS: "60"
  WORKER_DB_MAX_CONNECTIONS: "8"
  WORKER_DRAIN_TIMEOUT_SECS: "75"
  STUCK_EXECUTION_DEADLINE_SECS: "1800"
  WASM_CACHE_DIR: "/var/cache/hibana"
  TMPDIR: "/tmp"
  LOG_FORMAT: "json"
  RUST_LOG: "info"
  TRUST_PROXY_HEADERS: "false"
