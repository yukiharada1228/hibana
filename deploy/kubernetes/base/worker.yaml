apiVersion: v1
kind: ServiceAccount
metadata:
  name: hibana-worker
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hibana-worker
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hibana-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hibana-worker
        app.kubernetes.io/part-of: hibana
    spec:
      serviceAccountName: hibana-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          nodeTaintsPolicy: Honor
          # Count only the incoming revision so old Pods cannot skew rollout placement.
          matchLabelKeys: [pod-template-hash]
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hibana-worker
      containers:
        - name: worker
          image: hibana-platform
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/hibana-worker"]
          envFrom:
            - configMapRef:
                name: hibana-config
            - secretRef:
                name: hibana-runtime
          ports:
            - name: metrics
              containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "4"
              memory: "4Gi"
              ephemeral-storage: "5Gi"
          startupProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/hibana
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: "1Gi"
        - name: cache
          emptyDir:
            sizeLimit: "3Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: hibana-worker-metrics
spec:
  selector:
    app.kubernetes.io/name: hibana-worker
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hibana-worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hibana-worker

---
apiVersion: v1
kind: Service
metadata:
  name: hibana-worker-http
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hibana-worker
  ports:
    - name: http
      port: 8084
      targetPort: 8084
---
apiVersion: v1
kind: Service
metadata:
  name: hibana-worker-discovery
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: hibana-worker
  ports:
    - name: http
      port: 8084
      targetPort: 8084
