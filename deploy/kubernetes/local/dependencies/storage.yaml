apiVersion: v1
kind: ConfigMap
metadata: {name: hibana-local-postgres-init}
data:
  01-runtime-role.sh: |
    #!/bin/sh
    set -eu
    psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --set=ON_ERROR_STOP=1 --set=app_password="$POSTGRES_APP_PASSWORD" <<'SQL'
    CREATE ROLE faas_app LOGIN PASSWORD :'app_password' NOSUPERUSER NOBYPASSRLS;
    SQL
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: hibana-postgres}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: hibana-postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: hibana-postgres, app.kubernetes.io/part-of: hibana, hibana.io/dependency: "true"}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16
          envFrom: [{secretRef: {name: hibana-local-dependencies}}]
          env:
            - {name: POSTGRES_USER, value: hibana_admin}
            - {name: POSTGRES_DB, value: hibana}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, hibana_admin, -d, hibana]}
            periodSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: init, configMap: {name: hibana-local-postgres-init}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: hibana-minio}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: hibana-minio}
  template:
    metadata:
      labels: {app.kubernetes.io/name: hibana-minio, app.kubernetes.io/part-of: hibana, hibana.io/dependency: "true"}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: minio
          image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          args: [server, /data]
          envFrom: [{secretRef: {name: hibana-local-dependencies}}]
          ports: [{containerPort: 9000}]
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
            periodSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
