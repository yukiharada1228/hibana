apiVersion: batch/v1
kind: Job
metadata: {name: hibana-local-bucket}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels: {app.kubernetes.io/name: hibana-local-bucket, app.kubernetes.io/part-of: hibana}
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: setup
          image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          command: [/bin/sh, -ec]
          args:
            - |
              mc alias set local http://hibana-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null
              mc mb --ignore-existing local/hibana-components
          envFrom: [{secretRef: {name: hibana-local-dependencies}}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
