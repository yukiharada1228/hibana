apiVersion: apps/v1
kind: Deployment
metadata: {name: hibana-redis}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: hibana-redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: hibana-redis, app.kubernetes.io/part-of: hibana, hibana.io/dependency: "true"}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7-alpine
          args: [redis-server, --requirepass, "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: hibana-local-dependencies, key: REDIS_PASSWORD}
          ports: [{containerPort: 6379}]
          readinessProbe:
            tcpSocket: {port: 6379}
            periodSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 256Mi}
