# Optional add-on to an existing Hibana deployment. Requires metrics.k8s.io.
# The site must budget DB connections and node capacity before raising maxReplicas.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hibana-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hibana-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
