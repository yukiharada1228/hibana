apiVersion: apps/v1
kind: Deployment
metadata:
  name: hibana-console
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: hibana-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hibana-console
        app.kubernetes.io/part-of: hibana
        hibana.io/api-client: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: hibana-console
          env:
            - name: HIBANA_API_UPSTREAM
              value: http://hibana-api:8080
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: hibana-console
spec:
  selector:
    app.kubernetes.io/name: hibana-console
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hibana-console
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hibana-console
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              hibana.io/ingress: "true"
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hibana-control-plane
      ports:
        - {protocol: TCP, port: 8080}
