name: hibana
services:
  # ローカル公開 URL: http://<app>.<tenant>.hibana.local/ → ホスト上の CP(:8080)。
  # Docker Desktop 用。起動: docker compose up -d ingress（名前解決は /etc/hosts で設定）。
  ingress:
    image: nginx:stable-alpine
    profiles: [ingress]
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./docker/local-ingress.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # --- PostgreSQL: components / component_versions / executions（§3.2 を M1 に縮約） ---
  postgres:
    image: postgres:16
    container_name: hibana-postgres
    environment:
      # POSTGRES_USER=faas は SUPERUSER かつテーブル所有者。**マイグレーション専用**
      # （MIGRATION_DATABASE_URL）。0004_rls.sql がこの所有者で CREATE ROLE faas_app /
      # FORCE RLS / SECURITY DEFINER 関数を作る。M3b(§3.2): ランタイム（control-plane /
      # worker の DATABASE_URL）は migration 0004 が作る非特権 faas_app で接続する。
      # superuser/owner で接続すると FORCE RLS が無条件にバイパスされ RLS が無効化されるため、
      # アプリは起動時に current_user の rolsuper/rolbypassrls を検証して fail-fast する。
      POSTGRES_USER: faas
      POSTGRES_PASSWORD: faas
      POSTGRES_DB: faas
    ports:
      # .env.example の DATABASE_URL=postgres://faas:faas@localhost:5432/faas と一致。
      - "127.0.0.1:5432:5432"
    volumes:
      - hibana-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready で接続受付可能になるまで待つ。make migrate はこれを前提にする。
      test: ["CMD-SHELL", "pg_isready -U faas -d faas"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # --- Redis: 共有 admission ストア（M3d, §8）。レート制限 / in-flight 同時実行 / login 失敗
  #     ロックアウトを全 Axum インスタンスで共有して集計する（インスタンスローカルだと上限が
  #     実効 N 倍に緩む）。pure-Rust の redis crate（tokio-comp）でアクセスし、Lua アトミックで
  #     TOCTOU を避ける。本番は HA（Sentinel/Cluster）構成にすること（§9。単一障害点にしない）。 ---
  redis:
    image: redis:7-alpine
    container_name: hibana-redis
    # appendonly でカウンタの耐久性を上げる（再起動時は reaper が DB COUNT へ再同期するため
    # 厳密永続は必須でないが、短時間の再起動でカウンタを保つ）。
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # .env.example の REDIS_URL=redis://localhost:6379 と一致。
      - "127.0.0.1:6379:6379"
    volumes:
      - hibana-redis-data:/data
    healthcheck:
      # PING に PONG が返れば healthy。
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # --- MinIO: Component 本体の Object Storage（S3 互換, §3.4）。presigned GET URL を発行する ---
  minio:
    image: minio/minio
    container_name: hibana-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # .env.example の S3_ENDPOINT=http://localhost:9000 と一致。9001 は Web コンソール。
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # console
    volumes:
      - hibana-minio-data:/data
    healthcheck:
      # MinIO 健全性エンドポイント。バケット作成 (minio-setup) はこれを前提にする。
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # --- ワンショット: バケット hibana-components を冪等に作成する（§6.2 アップロード先） ---
  minio-setup:
    image: minio/mc
    container_name: hibana-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    # alias 設定 → バケット作成（既存なら no-op）。完了後に終了する。
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/${S3_BUCKET:-hibana-components}
      "
    restart: "no"

  # --- Jaeger: 分散トレーシングの OTLP 受信 + UI（M10, §3.8）---
  # control-plane / worker は OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 を設定したときだけ
  # ここへ span を送る（既定 off なら未使用）。UI は http://localhost:16686。
  # all-in-one はインメモリ保存で、開発・デバッグ用途に十分（本番は永続 backend を別途）。
  jaeger:
    profiles: [observability]
    image: jaegertracing/all-in-one:1.60
    container_name: hibana-jaeger
    environment:
      # OTLP 受信を有効化する（4317=gRPC / 4318=HTTP）。本 repo は HTTP/protobuf exporter を使う。
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686" # Web UI
      - "127.0.0.1:4318:4318"   # OTLP over HTTP（exporter の向き先）
      - "127.0.0.1:4317:4317"   # OTLP over gRPC（使わないが標準ポートとして開けておく）
    restart: unless-stopped

volumes:
  hibana-postgres-data:
    name: ${HIBANA_POSTGRES_VOLUME:-hibana-postgres-data}
  hibana-redis-data:
    name: ${HIBANA_REDIS_VOLUME:-hibana-redis-data}
  hibana-minio-data:
    name: ${HIBANA_MINIO_VOLUME:-hibana-minio-data}
