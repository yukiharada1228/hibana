# Docker Desktop routes host.docker.internal to the host's control-plane.
server {
    listen 80;
    server_name _;
    client_max_body_size 32m;

    location / {
        proxy_pass http://host.docker.internal:8080;
        # Hibana resolves the app and tenant from the original Host header.
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
