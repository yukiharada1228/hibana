# Copy outside Git, e.g. .local/vps/inventory.yml. Identify the private NIC before network.yml.
all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/hibana_vps
    ansible_python_interpreter: /usr/bin/python3
    kubernetes_version: 1.36.5
    pod_cidr: 10.244.0.0/16
    service_cidr: 10.96.0.0/16
    # Your operator IP, not 0.0.0.0/0. SSH host keys must be verified before first use.
    ssh_source_cidrs: [203.0.113.10/32]
  children:
    control_plane:
      hosts:
        hibana-cp:
          ansible_host: 203.0.113.11
          node_ip: 192.168.100.11
          private_interface: enp7s0 # Verify against the actual provider NIC.
    management:
      hosts:
        hibana-management:
          ansible_host: 203.0.113.12
          node_ip: 192.168.100.12
          private_interface: enp7s0
    execution:
      hosts:
        hibana-execution:
          ansible_host: 203.0.113.13
          node_ip: 192.168.100.13
          private_interface: enp7s0
    workers:
      children:
        management: {}
        execution: {}
