apiVersion: v1
kind: Service
metadata: {name: hibana-objects}
spec:
  selector: {app.kubernetes.io/name: hibana-objects}
  ports: [{name: s3, port: 9000, targetPort: 9000}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: hibana-objects-data}
spec:
  storageClassName: hibana-local
  volumeName: hibana-objects-data
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 20Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: hibana-objects}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: hibana-objects}
  template:
    metadata:
      labels: {app.kubernetes.io/name: hibana-objects, app.kubernetes.io/part-of: hibana, hibana.io/dependency: "true"}
    spec:
      nodeSelector: {hibana.io/role: execution}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: garage
          image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
          command: [/garage]
          args: [server, --single-node, --default-bucket]
          envFrom: [{secretRef: {name: hibana-objects}}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports: [{containerPort: 9000}]
          startupProbe:
            httpGet: {path: /health, port: 3903}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: 3903}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: 9000}
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/garage.toml, subPath: garage.toml, readOnly: true}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: hibana-objects-data}}
        - name: config
          secret:
            secretName: hibana-objects-config
