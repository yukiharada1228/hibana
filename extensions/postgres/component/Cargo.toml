[package]
name = "hibana-postgres-crypto"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasi = "=0.13.3"
wit-bindgen = "=0.36.0"
sha2 = "=0.10.9"
hmac = "=0.12.1"
pbkdf2 = { version = "=0.12.2", default-features = false, features = ["hmac"] }
md-5 = "=0.10.6"
unicode-normalization = "=0.1.25"

[profile.release]
opt-level = "s"
lto = true
strip = true

[workspace]
