[package]
name = "faas-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "faas-worker"
path = "src/main.rs"

[dependencies]
faas-shared = { workspace = true }

tokio = { workspace = true }

sqlx = { workspace = true }

futures = "0.3"

# --- Object Storage 本体取得 (§3.4): presigned GET URL の HTTP GET 用。
#     rustls-tls のみ（OpenSSL 非依存）。
# M7c (§4.6): `json` feature は secret 引き換え（POST /internal/job-env）のリクエスト/レスポンスを
# serde で扱うために必要。TLS は既存どおり rustls（OpenSSL / aws-lc-sys を回避）。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# --- ダウンロード本体の sha256 検証 (§3.6)。
sha2 = { workspace = true }
# --- in-memory Component キャッシュ (§3.6)。
lru = "0.18.4"
# M11-6 (§6.6): sha ごとの precompile single-flight ロック用（stampede 防止）。
dashmap = { workspace = true }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
wasmtime-wasi-http = { workspace = true }

# M11-5 (§4.2): wasi:http/incoming-handler の native component を駆動するために、
# host 側で HTTP リクエスト/レスポンスを組み立てる（wasmtime-wasi-http の new_incoming_request /
# ProxyPre が hyper 型を要求する）。
hyper = "1"
http-body-util = "0.1"
bytes = "1"

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# M10 (§3.8): 分散トレーシング。opt-in（OTEL_EXPORTER_OTLP_ENDPOINT 設定時のみ）。
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }

# 観測（M4a, §3.8）。worker は /metrics + /readyz を返す最小 axum サーバを spawn する。
# ルータ層のみ使うため tower-http は worker では不要（最小依存）。
axum = { workspace = true }
prometheus = { workspace = true }


[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
