[package]
name = "hibana-control-plane"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hibana-control-plane"
path = "src/main.rs"

[dependencies]
hibana-shared = { workspace = true }

# Web / 非同期（multipart: POST /components/{id}/versions のアップロード受信）
axum = { workspace = true, features = ["multipart"] }
tokio = { workspace = true }
tower-http = { workspace = true }

# Object Storage（MinIO/S3 互換。本体保存 + presigned GET URL。§3.4）
aws-sdk-s3 = { workspace = true }
aws-credential-types = { workspace = true }
# HTTP クライアントを rustls-ring で明示構築（aws-lc-sys / cc 依存を回避。§3.4）
aws-smithy-http-client = { workspace = true }

# Wasm 検証パイプライン（§6.2）
wasmparser = { workspace = true }
sha2 = { workspace = true }

# ジョブ署名トークン（M3c, §3.3）。control-plane だけが Ed25519 署名鍵を持つ。
# 鍵は固定 seed から構築するため署名/検証に RNG は不要（OsRng 機能は使わない）。
ed25519-dalek = { workspace = true }

# 認証ハッシュ（M3a, §3.3）。password_hash は argon2id、secret/salt 生成に rand。
# token_hash は sha2 を再利用する。
argon2 = { workspace = true }
rand = { workspace = true }
async-trait = { workspace = true }

# M7-0 / M7c (§5.1 / §4): 秘密素材（KEK / DEK / 復号済み平文）を Drop でゼロ化する。
zeroize = { workspace = true }
# M7c (§4.1): secret の封筒暗号（XChaCha20-Poly1305）。
chacha20poly1305 = { workspace = true }

# DB（query! マクロは使わずランタイム API のみ）
sqlx = { workspace = true }

# Async utilities.
futures = "0.3"

# 共有ストア（M3d, §8）。レート制限 / in-flight / login ロックアウトを全 Axum
# インスタンスで共有するカウンタ。Lua アトミック操作で TOCTOU を避ける。pure-Rust 構成。
redis = { workspace = true }

# シリアライズ / 時刻
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

# エラー / ログ
anyhow = { workspace = true }
# M9b (§6.2): 検証子プロセスで setrlimit(RLIMIT_AS) を呼ぶ（Linux）。
libc = "0.2"
thiserror = { workspace = true }
tracing = { workspace = true }

# 観測（M4a, §3.8）。Prometheus /metrics で使う TextEncoder + Registry。
prometheus = { workspace = true }

# Direct HTTP dispatch and native integration tests.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# --- 統合テスト専用 dev-dependencies ---
[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["multipart"] }
