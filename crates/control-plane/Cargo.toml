[package]
name = "faas-control-plane"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "control-plane"
path = "src/main.rs"

[dependencies]
faas-shared = { workspace = true }

# Web / 非同期（multipart: POST /components/{id}/versions のアップロード受信）
axum = { workspace = true, features = ["multipart"] }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Object Storage（MinIO/S3 互換。本体保存 + presigned GET URL。§3.4）
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-credential-types = { workspace = true }
# HTTP クライアントを rustls-ring で明示構築（aws-lc-sys / cc 依存を回避。§3.4）
aws-smithy-http-client = { workspace = true }

# Wasm 検証パイプライン（§6.2）
wasmparser = { workspace = true }
sha2 = { workspace = true }

# ジョブ署名トークン（M3c, §3.3）。control-plane だけが Ed25519 署名鍵を持つ。
# 鍵は固定 seed から構築するため署名/検証に RNG は不要（OsRng 機能は使わない）。
ed25519-dalek = { workspace = true }

# 認証ハッシュ（M3a, §3.3）。password_hash は argon2id、secret/salt 生成に rand。
# token_hash は sha2 を再利用する。
argon2 = { workspace = true }
rand = { workspace = true }
async-trait = { workspace = true }

# DB（query! マクロは使わずランタイム API のみ）
sqlx = { workspace = true }

# メッセージング
async-nats = { workspace = true }
# Stream トレイト (Subscriber は futures::Stream を実装)。async-nats と整合。
futures = "0.3"

# 共有ストア（M3d, §8）。レート制限 / in-flight / login ロックアウトを全 Axum
# インスタンスで共有するカウンタ。Lua アトミック操作で TOCTOU を避ける。pure-Rust 構成。
redis = { workspace = true }

# シリアライズ / 時刻
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

# エラー / ログ
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# 観測（M4a, §3.8）。Prometheus /metrics で使う TextEncoder + Registry。
prometheus = { workspace = true }

# --- 統合テスト専用 dev-dependencies ---
[dev-dependencies]
# M4 chaos tests（tests/chaos_m4.rs）の HTTP クライアント。プロダクションコードでは使わない。
# worker と同じ rustls-tls バックエンドで OpenSSL/aws-lc-sys を回避。`json` feature は
# テスト中のリクエスト/レスポンスの serde 統合のため必要。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# chaos_b の Idempotency-Key 生成にユニーク nanos を埋める用途。
chrono = { workspace = true }
# chaos テストの async ランタイム（既存の workspace tokio を re-import するだけ）。
tokio = { workspace = true }
