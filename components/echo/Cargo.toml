[package]
name = "echo"
version = "0.1.0"
edition = "2021"
publish = false

# wasm32-wasip2 でビルドすると Component が直接生成される。
# build-component (別担当の Makefile) は:
#   cargo build --release -p echo --target wasm32-wasip2
# を想定し、生成物 target/wasm32-wasip2/release/echo.wasm を
# COMPONENTS_DIR/echo.wasm として配置する。
[lib]
crate-type = ["cdylib"]

[dependencies]
# guest バインディング生成 + serde_json で {"echo": ...} に包む。
wit-bindgen = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Component サイズ削減（M1 では任意だが有効化しておく）。
opt-level = "s"
lto = true
strip = true
