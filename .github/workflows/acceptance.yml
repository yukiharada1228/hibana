name: Kubernetes sustained acceptance

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Sustained load duration in seconds (120–7200)
        type: number
        default: 7200
        required: true

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - name: Validate duration
        env:
          ACCEPTANCE_SECONDS: ${{ inputs.seconds }}
        run: python -c "import os; n=int(os.environ['ACCEPTANCE_SECONDS']); assert 120 <= n <= 7200"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'
      - name: Install isolated test tooling
        run: |
          python -m pip install PyYAML==6.0.3
          curl --fail --location --retry 3 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 -o "$RUNNER_TEMP/kind"
          printf '%s  %s\n' aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d "$RUNNER_TEMP/kind" | sha256sum --check
          chmod +x "$RUNNER_TEMP/kind"
          sudo install "$RUNNER_TEMP/kind" /usr/local/bin/kind
          npm ci --prefix sdk
      - uses: docker/setup-buildx-action@v3
      - name: Build the tested platform
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: hibana-platform:acceptance
          load: true
          cache-from: |
            type=gha,scope=acceptance
            type=gha,scope=release-amd64
            type=gha
          cache-to: type=gha,scope=acceptance,mode=max
      - name: Install the packed CLI
        run: |
          node scripts/release.mjs cli "$RUNNER_TEMP/acceptance-package"
          npm install --prefix "$RUNNER_TEMP/acceptance-cli" --no-audit --no-fund "$RUNNER_TEMP"/acceptance-package/hibana-cli-*.tgz
      - name: Short acceptance including recovery
        run: |
          python scripts/acceptance/kubernetes.py --seconds 120 --cluster hibana-acceptance-smoke \
            --image hibana-platform:acceptance \
            --cli-entry "$RUNNER_TEMP/acceptance-cli/node_modules/@yukiharada1228/hibana/src/cli.mjs"
      - name: Sustained acceptance including recovery
        env:
          ACCEPTANCE_SECONDS: ${{ inputs.seconds }}
        run: |
          python scripts/acceptance/kubernetes.py --seconds "$ACCEPTANCE_SECONDS" --cluster hibana-acceptance-soak \
            --image hibana-platform:acceptance \
            --cli-entry "$RUNNER_TEMP/acceptance-cli/node_modules/@yukiharada1228/hibana/src/cli.mjs"
      # Never upload client credentials, kubeconfigs, environment files or backups.
      - name: Save sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-acceptance-evidence
          retention-days: 14
          include-hidden-files: true
          path: |
            .local/mvp-acceptance/*/report.json
            .local/mvp-acceptance/*/application.json
            .local/mvp-acceptance/*/recovery.json
            .local/mvp-acceptance/*/lifecycle.json
            .local/mvp-acceptance/*/version-code.json
            .local/mvp-acceptance/*/retention.json
            .local/mvp-acceptance/*/tail.json
            .local/mvp-acceptance/*/load.jsonl
            .local/mvp-acceptance/*/resources.jsonl
            .local/mvp-acceptance/*/application.log
