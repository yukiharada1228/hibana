name: CI

on:
  push:
    branches: [develop, main, "release/**"]
    # ドキュメントのみの変更では重い CI（特に release ビルド + e2e smoke）を回さない。
    # 変更が全て *.md / docs/ に収まる場合だけスキップ（コードを 1 つでも含めば通常どおり実行）。
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    branches: [develop, main]
    paths-ignore: ["**/*.md", "docs/**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  console:
    name: Console browser tests & image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci --prefix console --ignore-scripts
      - run: npm run build --prefix console
      - run: npx --prefix console playwright install --with-deps chromium
      - run: npm test --prefix console
      - name: Console proxy and authentication log privacy
        run: |
          node scripts/test-console-dev-proxy.mjs
          node scripts/test-console-proxy.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: console
          push: false
          cache-from: type=gha,scope=console
          cache-to: type=gha,mode=max,scope=console
  kubernetes:
    name: Kubernetes manifests & images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'
      - name: Check deployment contracts
        run: |
          python -m pip install PyYAML==6.0.3
          python scripts/check-kubernetes.py
          python sdk/platform/test_kubernetes.py
          python scripts/test_platform_install_fixture.py
          python scripts/test_resilience.py
          python scripts/acceptance/test_results.py
          node --test scripts/acceptance/credentials.test.mjs
      - uses: docker/setup-buildx-action@v3
      - name: Build Linux runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # ネイティブ crate（control-plane / worker / shared）のビルド・テスト。
  # SeaORMの型とマイグレーションはDBなしでビルドし、実DB試験は隔離環境で行う。
  native:
    name: build & test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # M3b (§3.2): テナント分離の静的ガード。toolchain 不要で安価なため最初に走らせる。
      # SET app.tenant_id ハザード（LOCAL 欠落・文字列結合）と、tenant-scoped db:: 呼び出しを
      # 生 pool に渡している箇所（GUC 未設定→FORCE RLS で fail-closed する）を検出して落とす。
      - name: rls-lint
        run: ./scripts/rls-lint.sh

      - name: Architecture boundaries
        run: python3 scripts/check-architecture.py

      # rust-toolchain.toml（stable + wasm32-wasip2）が channel を固定する。
      # clippy / rustfmt コンポーネントを固定 toolchain に追加する。
      - name: Install toolchain components
        run: rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@v2

      # まず「コンパイルが通るか」を確認する（最重要シグナル）。
      - name: build
        run: cargo build --workspace

      - name: test
        run: cargo test --workspace

      - name: Redis TLS transport (isolated Redis)
        run: bash scripts/test-redis-tls.sh

      - name: HTTP acceptance and provenance (isolated PostgreSQL)
        env:
          HIBANA_TEST_CONSOLE_IMAGE: hibana-console:verification
        run: |
          npm ci --prefix console --ignore-scripts
          npx --prefix console playwright install --with-deps chromium
          docker build -t hibana-console:verification console
          bash scripts/test-http.sh

      # 品質ゲート（コンパイル後に評価。最初の skeleton では赤になりうる）。
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: OIDC and optional SAML broker interoperability
        env:
          HIBANA_TEST_SAML: "1"
        run: bash scripts/test-oidc.sh

      - name: rustfmt
        run: cargo fmt --all -- --check

  smoke:
    name: e2e smoke (Wasm core)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # control-plane / worker（.env.example と一致。SECRETS_MASTER_KEY だけ placeholder を実鍵に差替）
      DATABASE_URL: postgres://faas_app:faas_app@localhost:5432/faas
      MIGRATION_DATABASE_URL: postgres://faas:faas@localhost:5432/faas
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: hibana-components
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      JOB_SIGNING_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8
      JOB_SIGNING_KID: k1
      SECRETS_MASTER_KEY: "0011223344556677889900112233445566778899001122334455667788990011"
      SECRETS_MASTER_KID: k1
      OIDC_ISSUER_URL: https://fixture-idp.invalid
      OIDC_CLIENT_ID: hibana
      OIDC_CLIENT_SECRET: fixture-only
      OIDC_CALLBACK_URL: https://console.invalid/api/auth/oidc/callback
      OIDC_CONSOLE_URL: https://console.invalid/
      BOOTSTRAP_ADMIN_TOKEN: dev-bootstrap-admin-token
      CONTROL_PLANE_INTERNAL_URL: http://localhost:8081
      APP_BIND_ADDR: "0.0.0.0:8083"
      # Discovery prepares every resolved Worker address. This listener is IPv4;
      # localhost also resolves to ::1 on Linux runners, where nothing listens.
      WORKER_HTTP_URL: http://127.0.0.1:8084
      WORKER_HTTP_BIND_ADDR: "0.0.0.0:8084"
      INGRESS_BASE_DOMAIN: hibana.local
      COMPONENTS_DIR: ./components
      WASM_CACHE_DIR: ./worker-cache
      RUST_LOG: info
      # CLI テスト認証（bootstrapで作るsmokeテナントと一致）
      HIBANA_URL: http://localhost:8080
      GATEWAY: http://localhost:8083
      HIBANA_TENANT: smoke
      HIBANA_INGRESS_DOMAIN: hibana.local
      REQ_TIMEOUT: "25"
      READY_TRIES: "15"
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          # release ビルドは重い。smoke が失敗してもキャッシュを保存し、次回ビルドを高速化する。
          cache-on-failure: true
          key: smoke-release

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: sdk/templates/go/go.sum

      - name: Start services (postgres / redis / minio)
        run: |
          docker compose up -d --wait postgres redis minio
          docker compose run --rm minio-setup

      # release ビルド: debug の wasmtime は 12MiB JS コンポーネントの precompile が CI(2core) で
      # 極端に遅く gate が実用にならないため、CP/worker は --release で立てる（precompile が高速化）。
      - name: Build control-plane + worker (release)
        run: cargo build --release -p hibana-control-plane -p hibana-worker

      - name: Validate without server runtime initialization
        run: node scripts/test-validation-child.mjs

      - name: Run migrations
        run: ./target/release/hibana-control-plane --migrate-only

      - name: Start control-plane + worker
        run: |
          mkdir -p "$COMPONENTS_DIR" "$WASM_CACHE_DIR"
          nohup ./target/release/hibana-control-plane > cp.log 2>&1 &
          # 2 個連結され != "000" になり、CP 未起動でもループが即 break してしまう＝worker が
          up=""
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://localhost:8080/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then up="$code"; break; fi
            sleep 1
          done
          [ -n "$up" ] || { echo "control-plane failed to become ready"; tail -n 100 cp.log; exit 1; }
          echo "control-plane up (HTTP $up)"
          nohup ./target/release/hibana-worker > worker.log 2>&1 &
          ok=""
          for i in $(seq 1 30); do
            if grep -q "HTTP worker started" worker.log; then ok=1; break; fi
            if grep -qiE "^Error|panic" worker.log; then break; fi
            sleep 1
          done
          [ -n "$ok" ] || { echo "worker failed to start HTTP listener"; tail -n 100 worker.log; exit 1; }
          echo "HTTP worker ready"

      - name: Bootstrap smoke tenant
        run: |
          code=$(curl -sS -o boot.json -w '%{http_code}' -X POST http://localhost:8080/admin/tenants \
            -H "Authorization: Bearer $BOOTSTRAP_ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"slug":"smoke","name":"Smoke Tenant","admin_email":"admin@example.com","admin_oidc_subject":"fixture-smoke-admin"}')
          echo "[$code] $(cat boot.json)"
          test "$code" = "201"
          node scripts/seed-smoke-credentials.mjs

      - name: Install SDK deps
        working-directory: sdk
        run: npm ci

      - name: Check JavaScript formatting
        run: npm run format:check --prefix sdk

      - name: Test language-neutral CLI
        working-directory: sdk
        run: npm test

      - name: Install the Wasm component composition tool
        run: |
          cargo install wac-cli --version 0.11.0 --locked --no-default-features --features wit

      - name: Verify distributable CLI outside the checkout
        run: HIBANA_RUNTIME_BIN="$GITHUB_WORKSPACE/target/release/hibana-worker" npm run test:package --prefix sdk

      - name: Build optional packages and test separate TCP / TLS
        # No Worker/CLI dependencies. Official tool archives are checksum-pinned.
        run: |
          curl --fail --location --retry 3 https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz -o "$RUNNER_TEMP/wasi-sdk.tar.gz"
          printf '%s  %s\n' b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4 "$RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          curl --fail --location --retry 3 https://github.com/bytecodealliance/wasmtime/releases/download/v36.0.14/wasmtime-v36.0.14-x86_64-linux.tar.xz -o "$RUNNER_TEMP/wasmtime.tar.xz"
          printf '%s  %s\n' 74cf96775172c1a752a1cdabc7b10c5a83ce5149e47e9065b54f913c62f13a14 "$RUNNER_TEMP/wasmtime.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/wasmtime.tar.xz" -C "$RUNNER_TEMP"
          npm ci --ignore-scripts --prefix extensions
          WASI_SDK_PATH="$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux" npm run build --prefix extensions
          CC_wasm32_wasip2="$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux/bin/clang" AR_wasm32_wasip2="$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux/bin/llvm-ar" cargo clippy --locked --release --target wasm32-wasip2 --workspace --manifest-path extensions/Cargo.toml -- -D warnings
          cargo fmt --manifest-path extensions/Cargo.toml --all -- --check
          cargo test --locked --workspace --lib --manifest-path extensions/Cargo.toml
          node scripts/test-extension-bundles.mjs
          WASMTIME_BIN="$RUNNER_TEMP/wasmtime-v36.0.14-x86_64-linux/wasmtime" node scripts/test-extension-boundaries.mjs
          WASMTIME_BIN="$RUNNER_TEMP/wasmtime-v36.0.14-x86_64-linux/wasmtime" HIBANA_TEST_CP_BIN=target/release/hibana-control-plane node scripts/test-tcp-tls-extension.mjs

      - name: Test optional PostgreSQL adapter and Drizzle on Wasm
        run: |
          npm ci --ignore-scripts --prefix scripts/fixtures/postgres
          node --test scripts/test-postgres-selection.mjs
          WASMTIME_BIN="$RUNNER_TEMP/wasmtime-v36.0.14-x86_64-linux/wasmtime" HIBANA_TEST_CP_BIN=target/release/hibana-control-plane node scripts/test-postgres-compatibility.mjs

      - name: Test generic application-owned JS and Rust Wasm extensions
        run: HIBANA_TEST_CP_BIN=target/release/hibana-control-plane node scripts/test-application-extensions.mjs

      - name: Bounded operational commands
        run: node --test scripts/test-bounded-process.test.mjs

      - name: Test standalone Wasmtime development and reload
        run: node scripts/test-dev.mjs

      - name: Test JavaScript, Rust and Go templates on Wasmtime and deployed fleet
        env:
          HIBANA_TEST_DEPLOY: "1"
        run: node scripts/test-components.mjs

      - name: Check native template formatting
        run: |
          rustfmt --check --edition 2021 sdk/templates/rust/src/lib.rs
          test -z "$(gofmt -l sdk/templates/go)"

      - name: Run HTTP MVP smoke including rollback
        run: node scripts/smoke.mjs

      - name: Dump control-plane + worker logs
        if: always()
        run: |
          echo "===== control-plane ====="; tail -n 200 cp.log || true
          echo "===== worker ====="; tail -n 200 worker.log || true
