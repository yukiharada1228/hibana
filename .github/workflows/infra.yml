name: VPS IaC
on:
  pull_request:
    paths: ['infra/**', 'deploy/**', 'sdk/platform/**', '.github/workflows/infra.yml']
  push:
    branches: [develop, main]
    paths: ['infra/**', 'deploy/**', 'sdk/platform/**', '.github/workflows/infra.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: azure/setup-kubectl@v4
        with: {version: 'v1.36.5'}
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: '1.15.1'}
      - run: python -m pip install -r infra/requirements.txt
      - run: |
          ansible-playbook -i infra/ansible/inventory.example.yml infra/ansible/network.yml --syntax-check
          ansible-playbook -i infra/ansible/inventory.example.yml infra/ansible/bootstrap.yml --syntax-check
          ansible-playbook -i infra/ansible/inventory.example.yml infra/ansible/deploy.yml --syntax-check
          python infra/tests/test_render.py
          terraform -chdir=infra/terraform/dns fmt -check -recursive
          terraform -chdir=infra/terraform/dns init -backend=false
          terraform -chdir=infra/terraform/dns validate
          terraform -chdir=infra/terraform/dns test
